[package]
name = "the-botty-man"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4"
clap = { version = "4.6.1", features = ["derive", "env"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serenity = "0.12"
strum = { version = "0.28", features = ["derive"] }
strum_macros = "0.28"
tokio = { version = "1.21.2", features = ["macros", "rt-multi-thread", "signal"] }
